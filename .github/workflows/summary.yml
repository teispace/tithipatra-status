# Once a day: response times per site (the history files), then the README summary.
name: Summary

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions: {}

# One group with the checker, so two pushes never race; the time sits between its runs.
concurrency:
  group: upptime
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      # This job pushes, and uploads no artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1 # zizmor: ignore[artipacked]
      - uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # 1.46.5
        with:
          command: response-time
        env:
          GH_PAT: ${{ github.token }}
      - uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # 1.46.5
        with:
          command: readme
        env:
          GH_PAT: ${{ github.token }}
